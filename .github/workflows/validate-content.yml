name: Validate content

# Checks posts and builds the site (without deploying) on every push and pull request,
# so problems show up before anyone runs "Publish website".
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the build never pushes, so don't leave a token on disk

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check posts
        run: npm run validate

      - name: Build site
        run: npm run build
