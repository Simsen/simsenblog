name: Validate content

# Checks posts and builds the site (without deploying) on every push and pull request,
# so problems show up before anyone runs "Publish website".
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check posts
        run: npm run validate

      - name: Build site
        run: npm run build
